name: Run GSR Scan

on:
  schedule:
    # GitHub Actions cron 使用 UTC 時間
    # 台灣時間 = UTC + 8
    #
    # 每批掃描 440 檔，共 9 批
    # 預計可覆蓋約 3960 檔股票
    #
    # 台灣時間：
    # 16:00 → offset 0
    # 17:00 → offset 440
    # 18:00 → offset 880
    # 19:00 → offset 1320
    # 20:00 → offset 1760
    # 21:00 → offset 2200
    # 22:00 → offset 2640
    # 23:00 → offset 3080
    # 00:00 → offset 3520

    - cron: '0 8 * * *'    # 台灣 16:00，offset 0
    - cron: '0 9 * * *'    # 台灣 17:00，offset 440
    - cron: '0 10 * * *'   # 台灣 18:00，offset 880
    - cron: '0 11 * * *'   # 台灣 19:00，offset 1320
    - cron: '0 12 * * *'   # 台灣 20:00，offset 1760
    - cron: '0 13 * * *'   # 台灣 21:00，offset 2200
    - cron: '0 14 * * *'   # 台灣 22:00，offset 2640
    - cron: '0 15 * * *'   # 台灣 23:00，offset 3080
    - cron: '0 16 * * *'   # 台灣 00:00，offset 3520

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # ① 下載 Repository 程式碼
      # ==================================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # ② 安裝 Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==================================================
      # ③ 安裝套件
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # ④ 依照執行時間決定股票掃描起點
      # ==================================================
      - name: Determine offset from UTC hour
        id: pick
        shell: bash
        run: |
          utc_hour=$(date -u +"%H")
          echo "🕒 Current UTC Hour: $utc_hour"

          if   [ "$utc_hour" = "08" ]; then
            offset=0
          elif [ "$utc_hour" = "09" ]; then
            offset=440
          elif [ "$utc_hour" = "10" ]; then
            offset=880
          elif [ "$utc_hour" = "11" ]; then
            offset=1320
          elif [ "$utc_hour" = "12" ]; then
            offset=1760
          elif [ "$utc_hour" = "13" ]; then
            offset=2200
          elif [ "$utc_hour" = "14" ]; then
            offset=2640
          elif [ "$utc_hour" = "15" ]; then
            offset=3080
          elif [ "$utc_hour" = "16" ]; then
            offset=3520
          else
            echo "⚠️ 非排程執行時間，預設 offset=0"
            offset=0
          fi

          echo "🚀 本次掃描 offset=$offset"
          echo "offset=$offset" >> "$GITHUB_OUTPUT"

      # ==================================================
      # ⑤ 執行股票掃描
      #
      # 左側：Python 讀取的環境變數名稱
      # 右側：GitHub Repository Secret 名稱
      # ==================================================
      - name: Run scanner
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

          WINDOW: "12"
          LOOKBACK_DAYS: "150"
          TOTAL_STOCKS_EXPECTED: "3850"
          NUM_BATCHES: "9"
          SLEEP_SEC: "0.5"

        run: |
          echo "🚀 本次 offset：${{ steps.pick.outputs.offset }}"
          echo "🚀 本次 limit：440"

          python gsr_scanner.py \
            --offset "${{ steps.pick.outputs.offset }}" \
            --limit 440

      # ==================================================
      # ⑥ 將狀態檔寫回 Repository
      # ==================================================
      - name: Commit state file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -d "state" ] && [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "chore(state): update seen list for $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No state changes to commit."
          fi
