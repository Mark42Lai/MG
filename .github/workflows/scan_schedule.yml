name: Run GSR Scan

on:
  schedule:
    - cron: '17 8 * * 1-5'   # 台灣 16:17，offset 0
    - cron: '17 9 * * 1-5'   # 台灣 17:17，offset 360
    - cron: '17 10 * * 1-5'  # 台灣 18:17，offset 720
    - cron: '17 11 * * 1-5'  # 台灣 19:17，offset 1080
    - cron: '17 12 * * 1-5'  # 台灣 20:17，offset 1440
    - cron: '17 13 * * 1-5'  # 台灣 21:17，offset 1800
    - cron: '17 14 * * 1-5'  # 台灣 22:17，offset 2160
    - cron: '17 15 * * 1-5'  # 台灣 23:17，offset 2520
    - cron: '17 16 * * 1-5'  # 台灣次日 00:17，offset 2880

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # ① 下載 Repository 程式碼
      # ==================================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:

      # ==================================================
      # ② 安裝 Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==================================================
      # ③ 安裝套件
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # ④ 依照執行時間決定股票掃描起點
      # ==================================================
      - name: Determine offset from scheduled cron
        id: pick
        shell: bash
        run: |
          case '${{ github.event.schedule }}' in
            '17 8 * * 1-5')  offset=0 ;;
            '17 9 * * 1-5')  offset=360 ;;
            '17 10 * * 1-5') offset=720 ;;
            '17 11 * * 1-5') offset=1080 ;;
            '17 12 * * 1-5') offset=1440 ;;
            '17 13 * * 1-5') offset=1800 ;;
            '17 14 * * 1-5') offset=2160 ;;
            '17 15 * * 1-5') offset=2520 ;;
            '17 16 * * 1-5') offset=2880 ;;
            '') offset=0 ;;  # 手動執行只測第一批
            *) echo '未知排程，停止以免重複掃描'; exit 1 ;;
          esac

          echo "本次掃描 offset=$offset"
          echo "offset=$offset" >> "$GITHUB_OUTPUT"

      # ==================================================
      # ⑤ 執行股票掃描
      #
      # 左側：Python 讀取的環境變數名稱
      # 右側：GitHub Repository Secret 名稱
      # ==================================================
      - name: Run scanner
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINAL_BATCH: ${{ github.event.schedule == '17 16 * * 1-5' && '1' || '0' }}

        run: |
          echo "🚀 本次 offset：${{ steps.pick.outputs.offset }}"
          echo "🚀 本次 limit：360"

          python gsr_scanner.py \
            --offset "${{ steps.pick.outputs.offset }}" \
            --limit 360
          fi
