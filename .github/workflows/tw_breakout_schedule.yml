name: Run GSR Scan
on:
  schedule:
    # Poll all UTC hours; determine due batches from the actual Asia/Taipei clock.
    - cron: '15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tw_breakout_schedule.yml'
permissions:
  contents: write
concurrency:
  group: taiwan-evening-scan
  cancel-in-progress: false
jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Recover due Taiwan evening batches
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python -u evening_scan.py
