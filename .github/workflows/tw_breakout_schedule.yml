name: Run GSR Scan

on:
  schedule:
    - cron: '15 9 * * 1-5'   # 台灣 17:15，offset 0
    - cron: '15 10 * * 1-5'   # 台灣 18:15，offset 380
    - cron: '15 11 * * 1-5'   # 台灣 19:15，offset 760
    - cron: '15 12 * * 1-5'   # 台灣 20:15，offset 1140
    - cron: '15 13 * * 1-5'   # 台灣 21:15，offset 1520
    - cron: '15 14 * * 1-5'   # 台灣 22:15，offset 1900
    - cron: '15 15 * * 1-5'   # 台灣 23:15，offset 2280

  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      # ==================================================
      # ① 下載 Repository 程式碼
      # ==================================================
      - name: Checkout repo
        uses: actions/checkout@v4
      # ==================================================
      # ② 安裝 Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==================================================
      # ③ 安裝套件
      # ==================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==================================================
      # ④ 依照執行時間決定股票掃描起點
      # ==================================================
      - name: Determine offset from scheduled cron
        id: pick
        shell: bash
        run: |
          case '${{ github.event.schedule }}' in
            '15 9 * * 1-5') offset=0 ;;
            '15 10 * * 1-5') offset=380 ;;
            '15 11 * * 1-5') offset=760 ;;
            '15 12 * * 1-5') offset=1140 ;;
            '15 13 * * 1-5') offset=1520 ;;
            '15 14 * * 1-5') offset=1900 ;;
            '15 15 * * 1-5') offset=2280 ;;
            '') offset=0 ;;  # 手動執行只測第一批
            *) echo '未知排程，停止以免重複掃描'; exit 1 ;;
          esac

          echo "本次掃描 offset=$offset"
          echo "offset=$offset" >> "$GITHUB_OUTPUT"

      # ==================================================
      # ⑤ 執行股票掃描
      #
      # 左側：Python 讀取的環境變數名稱
      # 右側：GitHub Repository Secret 名稱
      # ==================================================
      - name: Run scanner
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINAL_BATCH: ${{ github.event.schedule == '15 15 * * 1-5' && '1' || '0' }}

        run: |
          echo "🚀 本次 offset：${{ steps.pick.outputs.offset }}"
          echo "🚀 本次 limit：380"

          python -u gsr_scanner.py \
            --offset "${{ steps.pick.outputs.offset }}" \
            --limit 380
