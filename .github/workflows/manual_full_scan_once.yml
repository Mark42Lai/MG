name: One-time full Taiwan breakout scan
run-name: Manual first batch for 2026-10-27
on:
  push:
    branches: ['ops/manual-scan-20261022-0032']
    paths: ['.github/workflows/manual_full_scan_once.yml']
permissions:
  contents: read
jobs:
  scan:
    name: Batch offset ${{ matrix.offset }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        offset: [0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait for quota and run this manual batch
        shell: python
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          SCAN_OFFSET: ${{ matrix.offset }}
          FINAL_BATCH: ${{ matrix.offset == 2280 && '1' || '0' }}
        run: |
          import os
          import runpy
          import sys
          import time
          from datetime import date
          import requests

          # This is an explicitly requested manual catch-up, not a scheduled run.
          os.environ["GITHUB_EVENT_NAME"] = "workflow_dispatch"
          sys.argv = ["gsr_scanner.py", "--offset", os.environ["SCAN_OFFSET"], "--limit", "380"]
          scanner = runpy.run_path("gsr_scanner.py", run_name="manual_scanner")
          # Freeze the requested last closing date even if a job waits past midnight.
          scanner["main"].__globals__["get_taiwan_today"] = lambda: date(2026, 10, 27)
          # Retry only the failed API call, preserving earlier stock results.
          original_loader = scanner["main"].__globals__["DataLoader"]
          wait_deadline = time.monotonic() + 75 * 60
          def with_quota_wait(call, *args, **kwargs):
              while True:
                  try:
                      return call(*args, **kwargs)
                  except Exception as error:
                      if "Requests reach the upper limit" not in str(error):
                          raise
                      if time.monotonic() >= wait_deadline:
                          raise RuntimeError("Quota retry deadline reached; batch is incomplete") from error
                      print("FinMind quota exhausted; retrying the same API call in 60 seconds", flush=True)
                      time.sleep(60)
          class QuotaAwareLoader(original_loader):
              def taiwan_stock_daily(self, *args, **kwargs):
                  return with_quota_wait(super().taiwan_stock_daily, *args, **kwargs)
              def taiwan_stock_info(self, *args, **kwargs):
                  return with_quota_wait(super().taiwan_stock_info, *args, **kwargs)
          scanner["main"].__globals__["DataLoader"] = QuotaAwareLoader
          original_latest = scanner["main"].__globals__["get_latest_trade_date"]
          def require_requested_date(*args, **kwargs):
              latest = original_latest(*args, **kwargs)
              if latest != date(2026, 10, 27):
                  raise RuntimeError(f"2026-10-27 closing data is unavailable; latest={latest}")
              return latest
          scanner["main"].__globals__["get_latest_trade_date"] = require_requested_date
          scanner["main"]()
